; SmallTV-Ultra (GeekMagic) - firmware perso, ESP8266 / 4 Mo de flash
;
; Le decoupage flash DOIT rester "4M3M" (programme 1 Mo + LittleFS ~3 Mo),
; identique au firmware d'origine :
;   - la partition de fichiers d'origine (images, config) n'est pas touchee,
;   - un retour au firmware d'origine via /update reste possible.

[env:smalltv-ultra]
; Versions figees pour des releases reproductibles (core Arduino ESP8266 3.1.2)
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

; Configuration de l'ecran passee directement a TFT_eSPI
; (ST7789 240x240, SPI mode 3, CS non cable).
build_flags =
    -Os
    -D FW_VERSION=\"Custom-0.2.0\"
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_CS=-1
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
