; SmallTV-Ultra (GeekMagic) - Status-ESP firmware, ESP8266 / 4 MB flash
;
; The flash layout MUST stay "4M3M" (1 MB program + ~3 MB LittleFS),
; identical to the stock firmware:
;   - the stock file partition (images, config) is left untouched,
;   - going back to the stock firmware through /update stays possible.

[env:smalltv-ultra]
; Pinned versions for reproducible releases (Arduino ESP8266 core 3.1.2)
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
monitor_speed = 115200

; The firmware version is NOT set here: tools/version.py reads the VERSION file
; at the repository root and defines FW_VERSION from it.
; tools/embed_web.py turns web/index.html into src/generated/web_index.h (gzip in PROGMEM).
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_web.py

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ 7.4.3
    bodmer/TJpg_Decoder @ 1.1.0
    bitbank2/AnimatedGIF @ 2.2.3

; Display configuration passed straight to TFT_eSPI
; (ST7789 240x240, SPI mode 3, CS not wired).
build_flags =
    -Os
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_CS=-1
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
